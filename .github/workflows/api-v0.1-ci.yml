name: API v0.1 CI

on:
  push:
    branches:
      - feat/research-universe-api-v0.1
  pull_request:
    paths:
      - api.py
      - requirements.txt
      - src/research_universe_api_service.py
      - src/research_universe_entry.py
      - tests/test_research_universe_api.py
      - tests/test_research_universe_api_service.py
      - .github/workflows/api-v0.1-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile API modules
        run: python -m compileall api.py src/research_universe_api_service.py src/research_universe_entry.py

      - name: Run API tests
        run: pytest -q tests/test_research_universe_api.py tests/test_research_universe_api_service.py
