name: Research Universe CI

on:
  push:
    branches:
      - feat/research-universe-canonical-candidates-v0.1
  pull_request:
    paths:
      - app.py
      - requirements.txt
      - src/research_universe.py
      - src/research_universe_*.py
      - src/universe_analysis*.py
      - src/universe_interpretation*.py
      - src/candidate_identity_validation.py
      - src/research_conversation/**
      - tests/test_research_universe*.py
      - tests/test_universe_analysis*.py
      - tests/test_universe_interpretation*.py
      - tests/test_candidate_identity_validation.py
      - .github/workflows/research-universe-ci.yml
      - .github/workflows/rce-evidence-validation.yml
      - pytest.ini
      - tests/test_rce_authored_source_corpus.py
      - tests/test_rce_benchmark_explorer_service.py

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile project modules
        run: python -m compileall app.py src tests

      - name: Run full test suite
        run: python -m pytest -q -m "not authoritative_rce_evidence"

      - name: Check for whitespace errors
        run: git diff --check HEAD^
